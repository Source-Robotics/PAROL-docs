{#-
  Material's own partial, with one fix: the base is resolved against the page's location. Material builds it as
  new URL("{{ base_url }}") and, with the relative base of a versioned site (".."), that throws on every page
  load and the banner for an older version stays hidden after a reload.
-#}
<script>var el=document.querySelector("[data-md-component=outdated]"),base=new URL("{{ base_url }}",location),outdated=__md_get("__outdated",sessionStorage,base);!0===outdated&&el&&(el.hidden=!1)</script>
