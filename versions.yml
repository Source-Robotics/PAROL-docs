# The version facts of this documentation, in ONE place (the same system as Source-Robotics/par6).
#
# Edit them here, never in a page. hooks/versions.py writes them into each document's version box
# (<!-- doc-meta: KEY --> on its landing page) and into the list of documents (<!-- documents-table -->), and the
# publishing workflow reads docs_version. README.md, "Versions and releases", says when to change what.

# The documentation version: the PAROL6 release the pages describe (the arm's mechanical files, the control board
# firmware and the BOM are released together, as V1). The publishing workflow publishes the site under this name
# (the version selector in the header) and points "latest" at it.
docs_version: "1.1"

# The release the pages describe. Its tag must be V<docs_version>. The control board firmware lives in the same
# repository (firmware.src); its #define VERSION is the number of the release that last changed it (1 for the
# releases 1 and 1.1, whose firmware is the same).
firmware:
  name: PAROL6 release
  repository: https://github.com/Source-Robotics/PAROL6-Desktop-robot-arm
  tag: V1.1
  src: PAROL6 control board main software/src

# The PC software the pages describe. The Python API is released on its own schedule: tools/sync_api.py reads its
# source at python_api.tag and builds the API reference from it. The commander software has no releases; the
# pages describe its main branch as of the date given.
software:
  python_api:
    name: Python API (parol6)
    repository: https://github.com/PCrnjak/PAROL6-python-API
    tag: v0.9.1
    released: 2026-10-03
  commander:
    name: PAROL6 commander software
    repository: https://github.com/Source-Robotics/PAROL-commander-software
    tag: main
    released: 2025-09-23

# The robot model the pages' model pictures, the 3D viewer, the kinematics sheets and the joint limits come from.
# tools/build_model.py and the figure tools read a clone at this tag; a page writes it as
# <!-- version: models.robot_descriptions -->. Licensed CC BY 4.0 since 2.15.0: the footer credits it.
models:
  robot_descriptions:
    name: robot_descriptions
    repository: https://github.com/Source-Robotics/robot_descriptions
    tag: v2.15.1

# One entry per document. revision: YEAR.LETTER, a new letter for every published revision of that document.
# status: draft until the document is published; published: the date of the revision's publication, or null.
# firmware: true for a document that describes one PAROL6 release (docs_version) and shows it in its version box.
# software: the software components (keys above) whose versions the document's version box shows.
manuals:
  parol6:
    number: SR-1002
    title: PAROL6 Robot Manual
    revision: 2026.B
    status: published
    published: 2026-11-04
    firmware: true
    software: [python_api, commander]
    applies_to: PAROL6 with the PAROL6 control board v2.0
    covers: "the robot: quick start, safety, technical data, installation, operation, peripherals, maintenance, troubleshooting, transport; the build guide"
  board:
    number: SR-2002
    title: PAROL6 Control Board Manual
    revision: 2026.B
    status: published
    published: 2026-11-04
    firmware: true
    software: []
    applies_to: PAROL6 control board v2.0 and v1.2
    covers: "the control board: features, technical data, connectors and pinout, stepper drivers, I/O and E-stop, CAN, firmware upload, the test firmware, the serial protocol"
  programming:
    number: SR-4004
    title: PAROL6 Programming Guide
    revision: 2026.A
    status: published
    published: 2026-11-03
    firmware: true
    software: [python_api, commander]
    applies_to: ""
    covers: "the ways to program the robot, the concepts behind them, the Python API, RBTscript, ROS 2; the reference: every method of the Python API, the RBTscript commands, the serial protocol, the firmware parameters"
  end_effectors:
    number: SR-3004
    title: PAROL6 End Effectors Guide
    revision: 2026.A
    status: published
    published: 2026-11-03
    firmware: true
    software: [python_api, commander]
    applies_to: ""
    covers: "what goes on the flange: the pneumatic and vacuum grippers, the SSG-48 and MSG electric grippers, a tool of your own; mounting, connections, the joint 5 homing offset, driving them from the commander software and the Python API"
  gui:
    number: SR-4005
    title: PAROL6 GUI Guide
    revision: 2026.A
    status: published
    published: 2026-11-03
    firmware: true
    software: [commander]
    applies_to: ""
    covers: "the graphical programs: the commander software (installation, the windows, the tabs), Waldo Commander in the browser, Motor GUI for the grippers"
