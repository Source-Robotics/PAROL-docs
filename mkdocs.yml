site_name: PAROL6
site_description: Documentation for the PAROL6 desktop robotic arm by Source Robotics.
# Where the site is published: the organisation's docs domain, this repository's path. Search engines take each
# page's address from here, and the sitemap is built from it. mike adds the version under it (/PAROL-docs/1/).
site_url: https://docs.source-robotics.com/PAROL-docs/
# The docs repository: the "edit this page" target. The header card points at the product repositories instead
# (extra.repos below, overrides/partials/source.html).
repo_url: https://github.com/Source-Robotics/PAROL-docs
repo_name: Source-Robotics/PAROL-docs
edit_uri: edit/main/docs/
copyright: |
  &copy; 2026 <a href="https://source-robotics.com" target="_blank" rel="noopener">Source Robotics d.o.o.</a> ·
  Text and images <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> ·
  Code examples <a href="https://github.com/Source-Robotics/PAROL-docs/blob/main/LICENSE-CODE" target="_blank" rel="noopener">MIT</a> ·
  Robot models and pictures made from them: <a href="https://github.com/Source-Robotics/robot_descriptions" target="_blank" rel="noopener">robot_descriptions</a>,
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo_new_2.png
  favicon: assets/Icon2.png
  language: en
  font: false                  # Roboto is served from the site: docs/stylesheets/fonts.css
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - navigation.instant       # pages load without a full reload: faster, the scroll of the sidebar is kept
    - navigation.instant.prefetch   # a page is fetched while the pointer hovers its link
    - navigation.instant.progress   # a progress bar when a page takes long
    - navigation.prune         # the sidebar carries only the visible part of the navigation: smaller pages
    - navigation.tabs          # one tab per document: Robot Manual, Control Board, Programming, API reference, Support
    - navigation.tabs.sticky
    - navigation.sections      # the bold sidebar groups
    - navigation.indexes       # a chapter is a folder with its own page
    - navigation.footer        # Previous / Next
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.action.edit
    - content.tooltips          # title="..." on links and abbreviations become tooltips
    - content.footnote.tooltips
  palette:                      # the same as the PAR6 docs
    - scheme: slate            # dark by default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

plugins:
  - search
  - glightbox                 # click any image to zoom
  - git-revision-date-localized:   # "Last update" under every page, from its last commit
      type: date
      fallback_to_build_date: true   # a shallow checkout or a file git does not know yet
      exclude:
        - includes/*
  - social:
      cards_layout: default
      enabled: !ENV [ENABLE_SOCIAL, false]   # social cards only in CI (ENABLE_SOCIAL=true; they need Cairo + Pillow)
  # The addresses of the pages of the old site keep working.
  - redirects:
      redirect_maps:
        page2_2.md: 03-technical-data/specifications.md
        page3_1.md: board/index.md
        page3_2.md: quick-start.md
        page4.md: programming/index.md
        page4_1.md: gui/commander/the-gui.md
        page5.md: 06-peripherals/index.md
        page6.md: 02-safety/index.md
        page7.md: theory/index.md
  # One page with the whole manual (print_page/), for the PDF: hooks/pdf.py prints it with Chrome when DOCS_PDF is
  # set. Must stay the last plugin.
  - print-site:
      add_to_navigation: false
      print_page_title: "PAROL6, the whole documentation"
      add_table_of_contents: true
      toc_depth: 2
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: true
      add_print_site_banner: false

# The version facts of versions.yml written into the pages (the version box and the list of documents), and the
# API reference built from the Python API's source at its release tag (docs/includes/generated/api_facts.json,
# written by tools/sync_api.py).
hooks:
  - hooks/versions.py
  - hooks/api_pages.py
  - hooks/known_issues.py   # the known issues table from known_issues.yml
  - hooks/llms.py          # the Markdown twins, llms.txt and llms-full.txt from the content hooks' output
  - hooks/figures.py       # captions: standalone pictures become numbered figures (after llms.py: twins keep plain pictures)
  - hooks/pdf.py           # the PDF of the manual, from the print-site page, when DOCS_PDF is set

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - docs/includes
      check_paths: true
      auto_append:
        - abbreviations.md    # site-wide abbreviations -> tooltips on every page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols

extra:
  # Google Analytics 4 (one property for every docs site, the shared domain) and "Was this page helpful?" at the
  # end of every page: Material's integration records the page views and sends the votes as events named
  # "feedback". Both load only after the reader accepts the cookie banner (consent below).
  analytics:
    provider: google
    property: G-1DFG9VZDEB
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Tell us what is missing in
            <a href="https://github.com/Source-Robotics/PAROL-docs/issues/new" target="_blank" rel="noopener">an issue</a>,
            or on Discord.
  # The cookie banner the EU requires for Google Analytics; the analytics load only after "Accept".
  consent:
    title: Cookie consent
    description: >-
      We use cookies to see which pages are read and whether readers find what they look for.
      With your consent, you help us make this documentation better.
    actions:
      - accept
      - reject
      - manage
  # Comments under every page, through Giscus. All the docs sites share one Discussions home, the hub repository
  # Source-Robotics/source-robotics.github.io (the docs domain), category "Documentation": one thread per site and
  # page, created when the first reader comments. The IDs are the hub repository's and the category's; giscus.app
  # shows them for the repository and the category. Empty IDs: no comments are rendered. A page opts out with
  # `comments: false` in its front matter.
  comments:
    repo: Source-Robotics/source-robotics.github.io
    repo_id: "R_kgDOVTvtKQ"
    category: Documentation
    category_id: "DIC_kwDOVTvtKc4DKAXd"
  # The published version the Markdown twins and llms.txt link to (mike publishes each build under its version).
  # Markdown exports use the release from versions.yml, including on archived versions.
  # The PDF of the manual (hooks/pdf.py): the file under site/, written when DOCS_PDF is set.
  pdf:
    file: assets/PAROL6-manual.pdf
  # The version selector in the header (built by mike: one entry per published PAROL6 release + "latest").
  version:
    provider: mike
    default: latest
    alias: true
  # The header's repository card per section (overrides/partials/source.html): page-URL prefix -> repository.
  # A longer prefix listed later overrides a shorter one listed earlier.
  repos:
    - prefix: ""
      name: Source-Robotics/PAROL6-Desktop-robot-arm
      url: https://github.com/Source-Robotics/PAROL6-Desktop-robot-arm
    - prefix: programming/
      name: PCrnjak/PAROL6-python-API
      url: https://github.com/PCrnjak/PAROL6-python-API
    - prefix: gui/commander/
      name: Source-Robotics/PAROL-commander-software
      url: https://github.com/Source-Robotics/PAROL-commander-software
    - prefix: reference/
      name: PCrnjak/PAROL6-python-API
      url: https://github.com/PCrnjak/PAROL6-python-API
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Source-Robotics
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@source-robotics
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/source_robotics/
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/SourceRobotics
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/source-robotics
    - icon: fontawesome/brands/discord
      link: https://discord.gg/prjUvjmGpZ
    - icon: fontawesome/brands/patreon
      link: https://www.patreon.com/PCrnjak
  # Page status markers (front matter `status: ...`) shown as an icon in the sidebar.
  status:
    new: Recently added
    deprecated: Deprecated
    draft: Not written yet

extra_css:
  - stylesheets/fonts.css                                # the self-hosted fonts
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/copy-markdown.js                       # the "Copy this page as Markdown" button
  - javascripts/joint-calculator.js                    # the joint units calculator on Drives, ratios and resolution
  - javascripts/arm-viewer-loader.js                   # the 3D arm viewer, only on pages that have one
  - javascripts/mathjax-loader.js                       # loads MathJax only on pages with a formula
  - javascripts/vendor/tablesort.min.js                # sortable tables (click a header); tablesort 5.3.0, served from the site
  - javascripts/tablesort.js

exclude_docs: |
  includes/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

